name: iOS Fastlane Build Only

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the Unity Build workflow to download artifact from'
        required: true
        type: string

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Xcode project artifact
        id: download_xcode
        uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project
          path: build/ios
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - name: Set XCODE_PROJECT_PATH env
        run: echo "XCODE_PROJECT_PATH=build/ios" >> $GITHUB_ENV

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Ruby gems
        run: bundle install

      - name: Install CocoaPods
        run: |
          if [ -f "$XCODE_PROJECT_PATH/Podfile" ]; then
            bundle exec pod install --project-directory="$XCODE_PROJECT_PATH"
          fi

      - name: Run Fastlane (release lane, upload to App Store Connect)
        run: bundle exec fastlane ios release
        working-directory: ${{ env.XCODE_PROJECT_PATH }}
        env:
          APP_STORE_CONNECT_USERNAME: ${{ secrets.APPLE_CONNECT_EMAIL }}
          APP_IDENTIFIER: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_REPOSITORY: ${{ secrets.MATCH_REPOSITORY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          IOS_APP_NAME: ${{ secrets.IOS_APP_NAME }}
          APP_VERSION: ${{ secrets.APP_VERSION }}
